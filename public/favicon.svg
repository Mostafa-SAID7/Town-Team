<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        .bg { fill: #151515; }
        .mark { fill: #f08a5d; }
      }
      @media (prefers-color-scheme: light) {
        .bg { fill: #f7f4ec; }
        .mark { fill: #9a4324; }
      }
    </style>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" class="bg"/>
  <!-- Diamond Mark (◆) - Town Team Symbol -->
  <g transform="translate(256, 256)">
    <!-- Outer diamond shape -->
    <path class="mark" d="M 0,-120 L 120,0 L 0,120 L -120,0 Z" stroke="none"/>
    <!-- Inner circle for visual balance -->
    <circle class="bg" cx="0" cy="0" r="40" fill-opacity="0.3"/>
  </g>
</svg>
