name: Git Flow Validation

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-branch-name:
    name: Validate Branch Name
    runs-on: ubuntu-latest

    steps:
      - name: Validate branch naming convention
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          echo "Checking branch: $BRANCH_NAME"
          
          # Valid branch patterns
          if [[ $BRANCH_NAME =~ ^(feature|bugfix|fix|hotfix|release|docs|chore|infra)/ ]]; then
            echo "✓ Branch name '$BRANCH_NAME' follows Git Flow convention"
            exit 0
          else
            echo "✗ Branch name '$BRANCH_NAME' does not follow Git Flow conventions"
            echo ""
            echo "Valid patterns:"
            echo "  - feature/descriptive-name"
            echo "  - bugfix/descriptive-name"
            echo "  - release/X.Y.Z"
            echo "  - hotfix/descriptive-name"
            echo "  - docs/descriptive-name"
            echo "  - chore/descriptive-name"
            echo "  - infra/descriptive-name"
            exit 1
          fi

  validate-merge-target:
    name: Validate Merge Target
    runs-on: ubuntu-latest

    steps:
      - name: Check merge target is correct
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          BASE_BRANCH="${{ github.base_ref }}"
          
          echo "Branch: $BRANCH_NAME → Target: $BASE_BRANCH"
          
          # Feature, bugfix, docs, chore, infra branches should merge to develop
          if [[ $BRANCH_NAME =~ ^(feature|bugfix|docs|chore|infra)/ ]]; then
            if [[ $BASE_BRANCH != "develop" ]]; then
              echo "✗ '$BRANCH_NAME' should merge to 'develop', not '$BASE_BRANCH'"
              exit 1
            fi
            echo "✓ Merge target is correct (develop)"
          fi
          
          # Release and hotfix branches should merge to main or develop
          if [[ $BRANCH_NAME =~ ^(release|hotfix)/ ]]; then
            if [[ $BASE_BRANCH != "main" && $BASE_BRANCH != "develop" ]]; then
              echo "✗ '$BRANCH_NAME' should merge to 'main' or 'develop', not '$BASE_BRANCH'"
              exit 1
            fi
            echo "✓ Merge target is correct ($BASE_BRANCH)"
          fi
          
          exit 0

  validate-pr-labels:
    name: Validate PR Labels
    runs-on: ubuntu-latest

    steps:
      - name: Check PR has appropriate label
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          echo "PR Branch: $BRANCH_NAME"
          echo "Note: Labels are helpful but not required"
          echo "Suggested labels based on branch:"
          
          if [[ $BRANCH_NAME =~ ^feature/ ]]; then
            echo "  - type: feature"
          elif [[ $BRANCH_NAME =~ ^bugfix/ ]] || [[ $BRANCH_NAME =~ ^fix/ ]]; then
            echo "  - type: bug"
          elif [[ $BRANCH_NAME =~ ^docs/ ]]; then
            echo "  - type: docs"
          fi
