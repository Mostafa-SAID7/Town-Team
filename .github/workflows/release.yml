name: Release - Create Version & GitHub Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/workflows/ci.yml'
      - '.github/workflows/testing.yml'
      - '.github/workflows/code-quality.yml'
      - '.github/workflows/security-scanning.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: false
      release_type:
        description: 'Release type'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write
  pull-requests: read

jobs:
  create-release:
    name: Create Release & Tags
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Get current version
        id: current-version
        run: |
          VERSION=$(grep '"version"' package.json | head -1 | awk -F: '{ print $2 }' | sed 's/[",]//g' | xargs)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Calculate next version
        id: version
        run: |
          CURRENT_VERSION="${{ steps.current-version.outputs.version }}"
          RELEASE_TYPE="${{ github.event.inputs.release_type || 'patch' }}"
          
          # Parse version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          
          case $RELEASE_TYPE in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac
          
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          
          # Check if tag already exists and increment if needed
          while git rev-parse "v$NEW_VERSION" >/dev/null 2>&1; do
            PATCH=$((PATCH + 1))
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          done
          
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Generate changelog
        id: changelog
        run: |
          {
            echo 'changelog<<EOF'
            git log --oneline $(git describe --tags --abbrev=0 2>/dev/null || echo "HEAD")..HEAD | sed 's/^/- /' || echo "Initial release"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Update package.json version
        run: |
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version
          echo "Version updated to: ${{ steps.version.outputs.version }}"

      - name: Update CHANGELOG.md
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DATE=$(date '+%Y-%m-%d')
          
          # Create new entry
          {
            echo "## [$VERSION] - $DATE"
            echo ""
            echo "### Added"
            echo "- Add new features here"
            echo ""
            echo "### Fixed"
            echo "- Fix bugs here"
            echo ""
            echo "### Changed"
            echo "- Changes go here"
            echo ""
            echo ""
            cat CHANGELOG.md
          } > CHANGELOG.md.tmp
          
          mv CHANGELOG.md.tmp CHANGELOG.md
          echo "CHANGELOG updated"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          git commit -m "chore: release v${{ steps.version.outputs.version }}" || echo "No changes to commit"

      - name: Create git tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Check if tag already exists and delete it first
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists locally, deleting..."
            git tag -d "v$VERSION"
          fi
          git tag -a "v$VERSION" -m "Release version $VERSION"
          echo "Git tag created: v$VERSION"

      - name: Push changes and tags
        run: |
          git push origin main
          git push origin --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: |
            ## Version ${{ steps.version.outputs.version }}
            
            ### Changelog
            ${{ steps.changelog.outputs.changelog }}
            
            ### What's New
            - See commits for detailed changes
            
            ### Installation
            ```bash
            git clone https://github.com/Mostafa-SAID7/Town-Team.git
            cd Town-Team
            pnpm install
            pnpm dev
            ```
            
            ### Documentation
            - [Getting Started](./docs/GETTING_STARTED.md)
            - [Git Flow](./docs/GITFLOW.md)
            - [Architecture](./docs/ARCHITECTURE.md)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-release:
    name: Release Notification
    runs-on: ubuntu-latest
    needs: create-release
    if: success()

    steps:
      - name: Log Release Summary
        run: |
          echo "## Release Created Successfully ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${{ needs.create-release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Changes:**" >> $GITHUB_STEP_SUMMARY
          echo "${{ needs.create-release.outputs.changelog }}" >> $GITHUB_STEP_SUMMARY
